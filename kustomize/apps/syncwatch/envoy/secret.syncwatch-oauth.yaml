---
# OAuth client credentials for the OIDC SecurityPolicy. Replace the
# CHANGEME values in your overlay via your usual secrets tooling (SOPS,
# sealed-secrets, external-secrets, ...) — never commit them in plaintext.
apiVersion: v1
kind: Secret
metadata:
  name: syncwatch-oauth
  namespace: syncwatch
  labels:
    app.kubernetes.io/name: syncwatch
    app.kubernetes.io/part-of: syncwatch
type: Opaque
stringData:
  client-id: CHANGEME
  client-secret: CHANGEME
