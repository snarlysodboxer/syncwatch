---
# OIDC authentication at the gateway (Envoy Gateway). SyncWatch has no auth
# of its own; it reads the user's identity from the IdToken cookie this
# policy forwards. The `email` scope is what puts the email claim in the ID
# token. Register the redirect URL on your OAuth client.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: syncwatch-oidc
  namespace: syncwatch
  labels:
    app.kubernetes.io/name: syncwatch
    app.kubernetes.io/part-of: syncwatch
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: syncwatch
  oidc:
    provider:
      issuer: https://accounts.google.com
      authorizationEndpoint: https://accounts.google.com/o/oauth2/v2/auth?access_type=offline&prompt=consent
      tokenEndpoint: https://oauth2.googleapis.com/token
    clientID: CHANGEME
    clientSecret:
      name: syncwatch-oauth
    redirectURL: CHANGEME
    cookieDomain: CHANGEME
    scopes:
    - openid
    - email
    - profile
    refreshToken: true
    # The default TTLs apply only when the token response omits an expiry.
    # Google's ID/access tokens always carry one (1h), so defaultTokenTTL is
    # moot; its refresh tokens carry none, so defaultRefreshTokenTTL is the
    # effective session length.
    defaultTokenTTL: 48h
    defaultRefreshTokenTTL: 168h  # 1 week
